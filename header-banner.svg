<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="snow-jun-0 — Frontend Developer">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a6d"/>
      <stop offset="0.5" stop-color="#d300c5"/>
      <stop offset="1" stop-color="#05d9e8"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#05d9e8" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05d9e8" stop-opacity="0"/>
      <stop offset="1" stop-color="#05d9e8" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="900" height="240" rx="12"/></clipPath>
    <style>
      @keyframes scan {0%{transform:translateY(-10px);}100%{transform:translateY(250px);}}
      @keyframes gridscroll {0%{transform:translateY(0);}100%{transform:translateY(30px);}}
      @keyframes flicker {0%,92%,100%{opacity:1;}93%{opacity:.6;}95%{opacity:1;}97%{opacity:.75;}}
      @keyframes glitchP {0%,90%,100%{transform:translate(0,0);}91%{transform:translate(-2px,1px);}93%{transform:translate(2px,-1px);}}
      @keyframes glitchC {0%,90%,100%{transform:translate(0,0);}91%{transform:translate(2px,-1px);}93%{transform:translate(-2px,1px);}}
      @keyframes pulse {0%,100%{opacity:.85;}50%{opacity:1;}}
      @keyframes dash {to{stroke-dashoffset:-400;}}
      @keyframes caret {0%,49%{opacity:1;}50%,100%{opacity:0;}}
      .grid{animation:gridscroll 3s linear infinite;}
      .scan{animation:scan 4s linear infinite;}
      .title{animation:flicker 5s linear infinite;}
      .gp{animation:glitchP 6s steps(1) infinite;}
      .gc{animation:glitchC 6s steps(1) infinite;}
      .sub{animation:pulse 2.5s ease-in-out infinite;}
      .rule{stroke-dasharray:14 8;animation:dash 8s linear infinite;}
      .caret{animation:caret 1s steps(1) infinite;}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="240" fill="#0d0221"/>

    <!-- synthwave perspective grid (bottom) -->
    <g opacity="0.5">
      <g class="grid">
        <g stroke="url(#gridfade)" stroke-width="1">
          <line x1="0" y1="150" x2="900" y2="150"/>
          <line x1="0" y1="165" x2="900" y2="165"/>
          <line x1="0" y1="182" x2="900" y2="182"/>
          <line x1="0" y1="202" x2="900" y2="202"/>
          <line x1="0" y1="226" x2="900" y2="226"/>
          <line x1="0" y1="255" x2="900" y2="255"/>
        </g>
      </g>
      <g stroke="#05d9e8" stroke-width="1" stroke-opacity="0.3">
        <line x1="450" y1="150" x2="450" y2="240"/>
        <line x1="450" y1="150" x2="330" y2="240"/>
        <line x1="450" y1="150" x2="180" y2="240"/>
        <line x1="450" y1="150" x2="-40" y2="240"/>
        <line x1="450" y1="150" x2="570" y2="240"/>
        <line x1="450" y1="150" x2="720" y2="240"/>
        <line x1="450" y1="150" x2="940" y2="240"/>
      </g>
    </g>

    <!-- title with chromatic-aberration glitch -->
    <g class="title" filter="url(#glow)">
      <text class="gc" x="450" y="112" text-anchor="middle" font-size="72" font-weight="800"
            fill="#05d9e8" fill-opacity="0.55">snow-jun-0</text>
      <text class="gp" x="450" y="112" text-anchor="middle" font-size="72" font-weight="800"
            fill="#ff2a6d" fill-opacity="0.55">snow-jun-0</text>
      <text x="450" y="112" text-anchor="middle" font-size="72" font-weight="800"
            fill="url(#neon)">snow-jun-0</text>
    </g>

    <!-- subtitle -->
    <text class="sub" x="450" y="150" text-anchor="middle" font-size="20" letter-spacing="6"
          fill="#d1f7ff">&#171; FRONTEND DEVELOPER &#187;</text>
    <text x="450" y="150" text-anchor="middle" font-size="20" letter-spacing="6"
          fill="#05d9e8" opacity="0"><tspan class="caret" x="678" dy="0">_</tspan></text>

    <!-- animated neon rules -->
    <line class="rule" x1="40" y1="132" x2="360" y2="132" stroke="url(#sweep)" stroke-width="2"/>
    <line class="rule" x1="540" y1="132" x2="860" y2="132" stroke="url(#sweep)" stroke-width="2"/>

    <!-- corner brackets -->
    <g stroke="#ff2a6d" stroke-width="2" fill="none" opacity="0.8">
      <path d="M18 18 h26 M18 18 v26"/>
      <path d="M882 18 h-26 M882 18 v26"/>
      <path d="M18 222 h26 M18 222 v-26"/>
      <path d="M882 222 h-26 M882 222 v-26"/>
    </g>

    <!-- moving scanline -->
    <rect class="scan" x="0" y="0" width="900" height="2" fill="#05d9e8" opacity="0.25"/>
  </g>
  <rect x="1" y="1" width="898" height="238" rx="12" fill="none" stroke="#ff2a6d" stroke-opacity="0.5"/>
</svg>
