name: Generate Snake

"on":
  schedule:
    - cron: "23 */12 * * *"     # twice a day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate neon snake (dark + light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2305f0ff&color_dots=%231a0b2e,%235b1f6b,%23a01f8f,%23ff2a6d,%2305d9e8
            dist/snake-light.svg?color_snake=%23d300c5&color_dots=%23efe0ff,%23c9a0e6,%23d300c5,%23ff2a6d,%2305d9e8

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
