<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 16" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0B84C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0B84C" stop-opacity="1"/>
      <stop offset="1" stop-color="#E0B84C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E5AAC" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#5B8FD6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2E5AAC" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- base line -->
  <rect x="40" y="7" width="920" height="2" rx="1" fill="url(#base)"/>

  <!-- moving gold sweep -->
  <rect y="5.5" width="240" height="5" fill="url(#sweep)">
    <animate attributeName="x" from="-240" to="1000" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- center pulsing diamond -->
  <polygon points="500,2 508,8 500,14 492,8" fill="#E0B84C">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1.25 1.25;1 1" dur="2s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </polygon>

  <!-- side diamonds -->
  <polygon points="470,4 475,8 470,12 465,8" fill="#5B8FD6" opacity="0.9"/>
  <polygon points="530,4 535,8 530,12 525,8" fill="#5B8FD6" opacity="0.9"/>
</svg>
