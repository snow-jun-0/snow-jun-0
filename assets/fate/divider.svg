<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 16" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E5AAC" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#5B8FD6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2E5AAC" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E0B84C" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E0B84C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0B84C" stop-opacity="0"/>
      <stop offset="1" stop-color="#E0B84C" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- static background glow (still + small) -->
  <rect x="410" y="0" width="180" height="16" fill="url(#glow)"/>

  <!-- base line -->
  <rect x="40" y="7" width="920" height="2" rx="1" fill="url(#base)"/>

  <!-- side diamonds: subtle twinkle -->
  <polygon points="470,4 475,8 470,12 465,8" fill="#5B8FD6">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="2s" begin="0.4s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="530,4 535,8 530,12 525,8" fill="#5B8FD6">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="2s" begin="1.0s" repeatCount="indefinite"/>
  </polygon>

  <!-- center diamond: sweeps left -> right with a trailing gold glow -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="40,8; 960,8" dur="5s" repeatCount="indefinite"/>
    <rect x="-72" y="-2" width="72" height="4" rx="2" fill="url(#trail)"/>
    <polygon points="0,-6 8,0 0,6 -8,0" fill="#E0B84C"/>
  </g>
</svg>